<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Diwali</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="fireworks"></canvas>
  <main class="container">
    <div class="top-diya">🪔</div>
    <p class="eyebrow">FESTIVAL OF LIGHTS</p>
    <h1>Happy <span>Diwali</span></h1>
    <p class="message">May your life shine as bright as these beautiful lights. May happiness, prosperity and success always surround you.</p>
    <div class="diya-area">
      <div class="flame"></div>
      <div class="diya"><span>✿</span></div>
      <div class="glow"></div>
    </div>
    <button id="wishBtn">Click for a Surprise ✨</button>
    <h2 id="greeting" aria-live="polite"></h2>
    <p class="footer">Spread Love • Spread Happiness ❤️</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
